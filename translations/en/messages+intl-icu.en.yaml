# app
app:
    name: 'Tales from a Dev'
    author: 'Romain Monteil'
    job_title: 'Senior Back-end Developer'

    meta:
        description: 'Freelance senior back-end developer based in Limoges. I develop PHP applications using the Symfony and Laravel frameworks.'
        title: 'Tales from a Dev'

# common
common:
    cta:
        back_to_home: "Back to home"

# enum
enum:
    blog_category:
        ai: 'AI'
        architecture: 'Architecture'
        career: 'Career'
        dev-ops: 'DevOps'
        notes: 'Notes'
        performance: 'Performance'
        security: 'Security'
        testing: 'Testing'
    project_type:
        customer: 'Customer'
        github: 'GitHub'
    experience_position:
        backend_developer: 'Back-end Developer'
        frontend_developer: 'Front-end Developer'
        fullstack_developer: 'Fullstack Developer'
    experience_type:
        freelance: 'Freelance'
        part_time: 'Part-time'
        permanent_contract: 'Permanent contract'
        personal: 'Personal'
    language_level:
        native: 'Native'
        professional: 'Professional'

# error
error:
    back: 'Back'
    text: >-
        {status_code, select,
            403 {Vous ne passerez pas !!!}
            404 {Il semblerait que cette page n'existe pas !}
            500 {C'est facheux ...}
            other {{status_text}}
        }
    title: >-
        {status_code, select,
            403 {Nope}
            404 {There are no tales to tell...}
            500 {Ah !}
            other {Ola mon brave !}
        }

# website
website:
    navigation:
        home: 'Home'
        blog: 'Blog'
        resume: 'Resume'
        locale_switcher: 'Français'
        theme_switcher: >-
            {theme, select,
                dark {Switch to light mode}
                other {Switch to dark mode}
            }
    index:
        title: 'Romain Monteil - Senior Back-end Developer'
        section:
            hero:
                title: 'I design and build fast, accessible web applications'
                description: "Freelance developer with 15+ years' experience, I work mainly on {php} with {symfony} — based in France, collaborating with teams worldwide. Symfony Certified (Expert) and Twig Certified."
                available: 'Available for freelance work'
                cta:
                    projects: 'See my projects'
                    contact: 'Get in touch'
            blog:
                surtitle: '01 - Writing'
                title: 'Latest tales'
                description: 'Notes and lessons from my day-to-day as a developer.'
                read_all: 'Read all articles'
                read_more: 'Read more'
            open_source:
                surtitle: '02 - Open source'
                title: 'Projects I maintain'
                description: 'Open source tools and libraries, used in production.'
            experience:
                surtitle: '03 - Experience'
                title: "What I've built"
                description: 'A summary of my professional experience, in startups and freelance.'
                today: 'Today'
            contact:
                surtitle: '04 - Contact'
                title: "Let's work together"
                description: 'A project in mind? Get in touch for a quote.'
                location: 'Limoges, France'
                reply_time: 'Replies within 2 business days'
                text: 'So that I can best respond to your request and correctly assess the workload, please give as much detail as possible about the project. This will also enable me to give you an initial estimate as close as possible to the final quote.'
            faq:
                surtitle: '05 - FAQ'
                title: 'Frequently asked questions'
                description: 'Answers to the questions I get most often.'
                dl:
                    dt_1: "What's your availability?"
                    dd_1: "I am currently {available}."
                    dd_1_available: >-
                        {available, select,
                            yes {available}
                            other {unavailable}
                        }
                    dd_1_available_at: 'My next availability will be from {available_at}.'
                    dt_2: 'What are your rates?'
                    dd_2: 'My daily rate is around {daily_price}.'
                    dd_2_price: '{price} € / day'
                    dt_3: 'Do you work on site?'
                    dd_3: "I do all my work remotely."

    # blog
    blog:
        title: 'Blog'
        subtitle: 'Notes on PHP, Symfony and the things I run into while building for the web.'
        meta:
            description: 'Articles about PHP, Symfony and web development, written by Romain Monteil, freelance senior back-end developer.'
        published_at: 'Published on {date}'
        reading_time: '{minutes} min read'
        back_to_index: 'Back to all articles'
        empty: 'No article published yet.'
        category:
            title: 'Articles in {category}'
            meta:
                description: 'Every {category} article on PHP, Symfony and web development, written by Romain Monteil, freelance senior back-end developer.'
        tag:
            title: 'Articles tagged {tag}'
        tags:
            title: 'Browse by tag'

    # contact
    contact:
        text: 'Afin que je puisse répondre au mieux à votre demande et évaluer correctement la charge de travail, merci de donner un maximum de détail sur le projet. Cela me permettra également de vous transmettre un premier chiffrage au plus près du devis final.'
        title: 'Me contacter'

    # resume
    resume:
        title: 'Romain Monteil - Resume'
        contact:
            location: 'Limoges, France (Remote)'
        action:
            print: 'Print / Save as PDF'
        section:
            experience:
                title: 'Career'
                today: 'Today'
            skills:
                title: 'Skills'
                backend:
                    title: 'Backend'
                frontend:
                    title: 'Frontend'
                devops:
                    title: 'DevOps'
                architecture:
                    title: 'Architecture'
                methodology:
                    title: 'Methodology'
            certifications:
                title: 'Certifications'
            education:
                title: 'Education'
            languages:
                title: 'Languages'
            other:
                title: 'Other'
                item:
                    afup: 'Member of AFUP, Association Française des Utilisateurs de PHP'
                    oss: 'Open Source Contributor'

    # footer
    footer:
        copyright: '© {year} Romain Monteil. All rights reserved.'

# logout
logout:
    title: 'Logout'
